
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>HS Central — Checklist</title>
<style>
:root{--bg:#07131f;--panel:#0d2133;--panel2:#112b42;--line:#244057;--text:#f3f7fb;--muted:#91a6b8;--blue:#2492ff;--blue2:#1168c7;--green:#22c983;--red:#ff5d68;--amber:#ffbd45;--white:#fff;--shadow:0 18px 55px #0006;--r:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123450 0,#07131f 45%);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1180px;margin:auto;min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.loginCard{width:min(430px,100%);background:#0b2032;border:1px solid #24435c;border-radius:24px;padding:32px;box-shadow:var(--shadow)}.brand{font-weight:900;font-size:31px;letter-spacing:2px}.brand small{display:block;font-size:10px;letter-spacing:5px;color:#9fb7ca;margin-top:-3px}.loginCard h1{font-size:22px;margin:28px 0 4px}.muted{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#b9c9d5}.input,textarea,select{width:100%;border:1px solid #294961;background:#081a29;color:white;border-radius:11px;padding:12px 13px;outline:none}.input:focus,textarea:focus,select:focus{border-color:var(--blue)}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:850;background:#1a3448;color:white}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2))}.btn.danger{background:#5c2430}.btn.good{background:#126c4a}.btn.full{width:100%}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#071a2a;border-right:1px solid #1d374c;padding:22px 14px;position:sticky;top:0;height:100vh}.side .brand{padding:4px 12px 24px}.nav{display:grid;gap:7px}.nav button{border:0;text-align:left;background:transparent;color:#b7c7d4;padding:12px 13px;border-radius:10px;font-weight:750}.nav button.active,.nav button:hover{background:#123a5c;color:#fff}.nav .logout{position:absolute;bottom:22px;left:14px;right:14px}.main{padding:26px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.top h1{margin:0;font-size:26px}.chip{padding:8px 12px;background:#102a3e;border:1px solid #25445a;border-radius:999px;color:#bcd0df;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0c2031;border:1px solid #213d52;border-radius:var(--r);padding:18px;box-shadow:0 10px 30px #0002}.metric .label{color:#9db1c0;font-size:12px;font-weight:800}.metric strong{display:block;font-size:25px;margin-top:7px}.metric.red{border-color:#5d2d39}.metric.green{border-color:#225d49}.metric.blue{border-color:#235178}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sectionTitle h2{font-size:18px;margin:0}.tableWrap{overflow:auto;border:1px solid #203d52;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:680px;background:#0a1d2c}.table th,.table td{padding:12px;border-bottom:1px solid #1d394e;text-align:left;vertical-align:top}.table th{font-size:11px;color:#8fa7b9;text-transform:uppercase;background:#0f283c}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.badge.red{background:#542631;color:#ff9ca4}.badge.green{background:#164d3a;color:#75e7b4}.badge.amber{background:#4a3b1c;color:#ffd67c}.cta{margin-top:14px}.checkHead{display:flex;gap:12px;align-items:end}.checkHead .field{flex:1}.group{margin:18px 0;border:1px solid #214159;border-radius:16px;overflow:hidden;background:#0a1e2e}.groupTitle{padding:13px 15px;background:#102b41;font-weight:900;letter-spacing:.4px}.q{padding:15px;border-top:1px solid #1d394d}.q:first-of-type{border-top:0}.qTop{display:flex;justify-content:space-between;gap:15px;align-items:center}.qName{font-weight:800}.choices{display:flex;gap:8px}.choice{border:1px solid #35536a;background:#0a1a28;color:#dce8f0;border-radius:9px;padding:8px 12px;font-weight:850}.choice.yes.on{background:#145a43;border-color:#22a978}.choice.no.on{background:#632b35;border-color:#dc5967}.detail{margin-top:12px;padding:12px;background:#071927;border-radius:12px;border:1px solid #273f51}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.progress{height:8px;background:#183044;border-radius:99px;overflow:hidden;margin:10px 0 20px}.progress i{display:block;height:100%;background:var(--blue);width:0}.actions{display:flex;gap:10px;justify-content:flex-end;margin:18px 0}.modalBack{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(520px,100%);background:#0d2233;border:1px solid #2a4a61;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal h3{margin-top:0}.toast{position:fixed;right:18px;bottom:18px;background:#102b40;border:1px solid #31526a;padding:13px 16px;border-radius:12px;z-index:80;box-shadow:var(--shadow);max-width:360px}.loading{position:fixed;inset:0;background:#06111bd9;display:grid;place-items:center;z-index:100}.spinner{width:42px;height:42px;border:4px solid #28445a;border-top-color:#2a9cff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.adminGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.userRow{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #1e394d}.empty{padding:28px;text-align:center;color:#91a8b9}.mobileTop{display:none}.overdue{color:#ff7c85}.oktxt{color:#55dba1}@media(max-width:780px){.shell{display:block}.side{display:none}.main{padding:16px;padding-bottom:90px}.mobileTop{display:flex;position:sticky;top:0;z-index:20;background:#071a2a;border-bottom:1px solid #1d374c;padding:11px 14px;justify-content:space-between;align-items:center}.mobileTop .brand{font-size:20px}.mobileNav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#071a2af5;border-top:1px solid #254056;padding:7px;overflow:auto}.mobileNav button{flex:1;min-width:72px;border:0;background:transparent;color:#a9bdcc;padding:9px 5px;font-size:11px;font-weight:800}.cards,.adminGrid{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:22px}.qTop{align-items:flex-start;flex-direction:column}.choices{width:100%}.choice{flex:1}.detailGrid{grid-template-columns:1fr}.checkHead{display:block}.actions{position:sticky;bottom:64px;background:#07131fee;padding:10px 0;z-index:10}.actions .btn{flex:1}.userRow{grid-template-columns:1fr}.loginCard{padding:24px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginCard"><div class="brand">HS<small>CENTRAL</small></div><h1>Checklist Visita Lojas</h1><div class="muted">Acesso por filial ou administrador</div>
<div id="setupApi" class="card" style="margin:18px 0;padding:14px;display:none">
  <b>Conectar ao banco</b>
  <div class="muted" style="font-size:12px;margin:4px 0 10px">Cole abaixo a URL /exec da implantação do Apps Script. Isso é necessário somente na primeira vez neste aparelho.</div>
  <div class="field" style="margin:0"><input id="apiInput" class="input" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <button class="btn primary full" style="margin-top:8px" onclick="saveApiUrl()">Salvar conexão</button>
</div>
<div id="loginError" style="display:none;margin:14px 0;padding:11px 12px;border:1px solid #6a3340;background:#351b24;border-radius:10px;color:#ffabb2;font-weight:700"></div>
<div class="field"><label>USUÁRIO</label><input id="loginUser" class="input" autocomplete="username" placeholder="Ex.: moda, ponto, leo"></div><div class="field"><label>SENHA</label><input id="loginPass" type="password" class="input" autocomplete="current-password" placeholder="Senha"></div><button class="btn primary full" onclick="login()">Entrar</button><p class="muted" style="font-size:12px;margin-top:18px">Senha inicial: <b>hs</b></p></div></div>
<div id="system" class="hidden">
 <div class="mobileTop"><div class="brand">HS<small>CENTRAL</small></div><span id="mobileWho" class="chip"></span></div>
 <div class="shell"><aside class="side"><div class="brand">HS<small>CENTRAL</small></div><div id="nav" class="nav"></div></aside><main id="main" class="main"></main></div>
 <div id="mobileNav" class="mobileNav"></div>
</div>
<div id="modal" class="modalBack hidden"><div class="modal" id="modalBox"></div></div>
<div id="loading" class="loading hidden"><div class="spinner"></div></div><div id="toast" class="toast hidden"></div>
<script>
// COLE AQUI A URL /exec DA IMPLANTAÇÃO DO APPS SCRIPT
const API_URL_FIXA = 'https://script.google.com/macros/s/AKfycbzo7EwAAg5B-6gn-NwZ88LR0I_vLrX9-XHmt1jkNb5EVc39ajV2fvQU4JBK3WSesHki/exec';
let API_URL = API_URL_FIXA.startsWith('https://script.google.com/') ? API_URL_FIXA : (localStorage.getItem('hs_check_api_url')||'');
const S={token:localStorage.getItem('hs_check_token')||'',user:null,data:null,page:'inicio',draft:null,saveTimer:null};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function load(on=true){$('#loading').classList.toggle('hidden',!on)} function toast(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000)}
async function api(api,p={}){if(!API_URL.startsWith('https://script.google.com/')) throw new Error('Conecte o site ao Apps Script primeiro.');const body={api,token:S.token,...p};let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'});}catch(_){throw new Error('Não foi possível acessar o Apps Script. Confira a URL /exec e a implantação.');}let j;try{j=await r.json();}catch(_){throw new Error('O Apps Script não retornou uma resposta válida. Confira se a implantação está publicada como Aplicativo da Web.');}if(!j.ok)throw new Error(j.message||'Não foi possível concluir.');return j}
function showLoginError(msg){const e=$('#loginError');e.textContent=msg;e.style.display='block'}function clearLoginError(){const e=$('#loginError');if(e){e.textContent='';e.style.display='none'}}function updateApiSetup(){const box=$('#setupApi');if(box)box.style.display=API_URL.startsWith('https://script.google.com/')?'none':'block'}function saveApiUrl(){const v=$('#apiInput').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(v))return showLoginError('Cole a URL completa da implantação terminada em /exec.');localStorage.setItem('hs_check_api_url',v);API_URL=v;clearLoginError();updateApiSetup();toast('Conexão salva. Agora faça o login.')}async function login(){clearLoginError();if(!API_URL.startsWith('https://script.google.com/')){updateApiSetup();return showLoginError('Primeiro conecte o site à URL /exec do Apps Script.');}const usuario=$('#loginUser').value.trim(),senha=$('#loginPass').value;if(!usuario||!senha)return showLoginError('Informe usuário e senha.');try{load();const j=await api('login',{usuario,senha});S.token=j.token;S.user=j.user;localStorage.setItem('hs_check_token',S.token);await boot();}catch(e){showLoginError(e.message)}finally{load(false)}}
async function boot(){try{load();const j=await api('bootstrap');S.data=j;S.user=j.user;S.draft=j.rascunho||null;$('#login').classList.add('hidden');$('#system').classList.remove('hidden');$('#mobileWho').textContent=S.user.perfil==='ADMIN'?'Léo':S.user.filialNome;renderNav();go('inicio')}catch(e){logout(false);toast(e.message)}finally{load(false)}}
function logout(show=true){S.token='';S.user=null;S.data=null;localStorage.removeItem('hs_check_token');$('#system').classList.add('hidden');$('#login').classList.remove('hidden');if(show)toast('Sessão encerrada.')} 
function navItems(){return S.user.perfil==='ADMIN'?[['inicio','Início'],['pendencias','Pendências'],['historico','Histórico'],['usuarios','Usuários e senhas'],['avisos','Avisos']]:[['inicio','Início'],['checklist','Checklist'],['pendencias','Pendências'],['historico','Histórico'],['senha','Minha senha']]} 
function renderNav(){const h=navItems().map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');$('#nav').innerHTML=h+`<button class="logout" onclick="logout()">Sair</button>`;$('#mobileNav').innerHTML=navItems().map(x=>`<button data-p="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+`<button onclick="logout()">Sair</button>`}
function go(p){S.page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));({inicio:renderInicio,checklist:renderChecklist,pendencias:renderPendencias,historico:renderHistorico,usuarios:renderUsuarios,avisos:renderAvisos,senha:renderMinhaSenha}[p]||renderInicio)();window.scrollTo(0,0)}
function top(title,sub=''){return `<div class="top"><div><h1>${esc(title)}</h1>${sub?`<div class="muted">${esc(sub)}</div>`:''}</div><span class="chip">${esc(S.user.perfil==='ADMIN'?'Léo • Admin':S.user.filialNome)}</span></div>`}
function renderInicio(){if(S.user.perfil==='ADMIN')return renderAdminInicio();const r=S.data.resumoFiliais.find(x=>x.codigo===S.user.filialCodigo)||{};$('#main').innerHTML=top(`Olá, ${S.user.filialNome}`,'Acompanhe o checklist da sua filial.')+`<div class="cards"><div class="card metric green"><div class="label">ÚLTIMO CHECKLIST</div><strong>${esc(r.ultimoChecklist||'Ainda não realizado')}</strong></div><div class="card metric red"><div class="label">PENDÊNCIAS EM ABERTO</div><strong>${r.pendencias||0}</strong></div><div class="card metric blue"><div class="label">PRÓXIMO CHECKLIST</div><strong class="${r.vencido?'overdue':'oktxt'}">${esc(r.proximoChecklist||'Realizar agora')}</strong><span class="muted">${r.diasRestantes==null?'Sem histórico':r.diasRestantes<0?`Vencido há ${Math.abs(r.diasRestantes)} dia(s)`: `Faltam ${r.diasRestantes} dia(s)`}</span></div></div><button class="btn primary full cta" onclick="go('checklist')">${S.draft?'Continuar checklist':'Preencher checklist'}</button>${pendTable(S.data.pendencias.filter(x=>x.STATUS!=='SOLUCIONADA').slice(0,5),'Pendências em aberto')}`}
function renderAdminInicio(){const rs=S.data.resumoFiliais, venc=rs.filter(x=>x.vencido).length, p=rs.reduce((a,x)=>a+x.pendencias,0);$('#main').innerHTML=top('Painel do Administrador','Visão geral de todas as filiais.')+`<div class="cards"><div class="card metric blue"><div class="label">FILIAIS</div><strong>${rs.length}</strong></div><div class="card metric red"><div class="label">CHECKLISTS VENCIDOS</div><strong>${venc}</strong></div><div class="card metric red"><div class="label">PENDÊNCIAS ABERTAS</div><strong>${p}</strong></div></div><div class="sectionTitle"><h2>Situação das filiais</h2></div><div class="tableWrap"><table class="table"><thead><tr><th>Filial</th><th>Último</th><th>Próximo</th><th>Pendências</th><th>Status</th><th>Ação</th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${esc(r.nome)}</b></td><td>${esc(r.ultimoChecklist||'-')}</td><td>${esc(r.proximoChecklist||'-')}</td><td>${r.pendencias}</td><td><span class="badge ${r.vencido?'red':'green'}">${r.vencido?'VENCIDO':'EM DIA'}</span></td><td><button class="btn primary" onclick="novaPendenciaAdmin('${esc(r.codigo)}','${esc(r.nome)}')">+ Pendência</button></td></tr>`).join('')}</tbody></table></div>${pendTable(S.data.pendencias.filter(x=>x.STATUS!=='SOLUCIONADA').slice(0,10),'Últimas pendências')}`}

function novaPendenciaAdmin(codigo,nome){openModal(`<h3>Nova pendência — ${esc(nome)}</h3><p class="muted">A pendência ficará visível para a filial e para o administrador até ser marcada como solucionada.</p><div class="field"><label>TÍTULO / ASSUNTO *</label><input id="admPendTitulo" class="input" maxlength="120" placeholder="Ex.: Lâmpadas da vitrine"></div><div class="field"><label>DESCRIÇÃO DA PENDÊNCIA *</label><textarea id="admPendDetalhe" rows="4" placeholder="Descreva o que precisa ser corrigido"></textarea></div><div class="detailGrid"><div class="field"><label>RESPONSÁVEL (OPCIONAL)</label><input id="admPendResp" class="input" placeholder="Nome do responsável"></div><div class="field"><label>PRAZO (OPCIONAL)</label><input id="admPendPrazo" class="input" type="date"></div></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmarPendenciaAdmin('${esc(codigo)}')">Adicionar pendência</button></div>`)}

async function confirmarPendenciaAdmin(codigo){const titulo=$('#admPendTitulo').value.trim(),detalhe=$('#admPendDetalhe').value.trim(),responsavel=$('#admPendResp').value.trim(),prazo=$('#admPendPrazo').value;if(!titulo)return toast('Informe o título da pendência.');if(!detalhe)return toast('Descreva a pendência.');try{load();await api('criarPendenciaAdmin',{filialCodigo:codigo,titulo,detalhe,responsavel,prazo});closeModal();await refresh();go('inicio');toast('Pendência adicionada à filial.')}catch(e){toast(e.message)}finally{load(false)}}

function newDraft(){return {responsavel:'',iniciadoEm:new Date().toISOString(),observacaoGeral:'',respostas:S.data.perguntas.map(q=>({id:q.id,secao:q.secao,item:q.item,tipo:q.tipo,resposta:'',detalhe:'',quantidade:'',localizacao:'',responsavelPendencia:'',prazoPendencia:''}))}}
function renderChecklist(){if(!S.draft)S.draft=newDraft();const d=S.draft,done=d.respostas.filter(x=>x.resposta).length,total=d.respostas.length;let groups={};d.respostas.forEach(r=>(groups[r.secao]??=[]).push(r));$('#main').innerHTML=top('Checklist Visita Lojas','Responda todos os itens. Marcar NÃO abre o registro da pendência.')+`<div class="checkHead"><div class="field"><label>RESPONSÁVEL PELO CHECKLIST</label><input class="input" value="${esc(d.responsavel)}" oninput="updRoot('responsavel',this.value)"></div><div class="chip">${done} de ${total}</div></div><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div>`+Object.entries(groups).map(([g,arr])=>`<div class="group"><div class="groupTitle">${esc(g)}</div>${arr.map(q=>qHtml(q)).join('')}</div>`).join('')+`<div class="field"><label>OBSERVAÇÃO GERAL (OPCIONAL)</label><textarea rows="3" oninput="updRoot('observacaoGeral',this.value)">${esc(d.observacaoGeral)}</textarea></div><div class="actions"><button class="btn" onclick="saveDraft(true)">Salvar rascunho</button><button class="btn primary" onclick="finishChecklist()">Finalizar checklist</button></div>`}
function qHtml(q){return `<div class="q"><div class="qTop"><div class="qName">${esc(q.item)}</div><div class="choices"><button class="choice yes ${q.resposta==='SIM'?'on':''}" onclick="answer(${q.id},'SIM')">✓ Sim</button><button class="choice no ${q.resposta==='NAO'?'on':''}" onclick="answer(${q.id},'NAO')">✕ Não</button></div></div>${q.resposta==='NAO'?detailHtml(q):''}</div>`}
function detailHtml(q){return `<div class="detail"><div class="field"><label>DETALHES DA PENDÊNCIA *</label><textarea rows="2" oninput="updQ(${q.id},'detalhe',this.value)" placeholder="Descreva o que precisa ser corrigido">${esc(q.detalhe)}</textarea></div>${q.tipo==='lampada'?`<div class="detailGrid"><div class="field"><label>QUANTAS?</label><input class="input" type="number" min="1" value="${esc(q.quantidade)}" oninput="updQ(${q.id},'quantidade',this.value)"></div><div class="field"><label>LOCALIZAÇÃO</label><input class="input" value="${esc(q.localizacao)}" placeholder="Ex.: vitrine lado direito" oninput="updQ(${q.id},'localizacao',this.value)"></div></div>`:''}<div class="detailGrid"><div class="field"><label>RESPONSÁVEL PELA CORREÇÃO (OPCIONAL)</label><input class="input" value="${esc(q.responsavelPendencia)}" oninput="updQ(${q.id},'responsavelPendencia',this.value)"></div><div class="field"><label>PRAZO (OPCIONAL)</label><input class="input" type="date" value="${esc(q.prazoPendencia)}" oninput="updQ(${q.id},'prazoPendencia',this.value)"></div></div></div>`}
function updRoot(k,v){S.draft[k]=v;scheduleSave()} function updQ(id,k,v){const q=S.draft.respostas.find(x=>x.id===id);if(q)q[k]=v;scheduleSave()} function answer(id,v){const q=S.draft.respostas.find(x=>x.id===id);q.resposta=v;if(v==='SIM'){q.detalhe='';q.quantidade='';q.localizacao='';q.responsavelPendencia='';q.prazoPendencia=''}renderChecklist();scheduleSave()}
function scheduleSave(){clearTimeout(S.saveTimer);S.saveTimer=setTimeout(()=>saveDraft(false),1200)} async function saveDraft(show){try{await api('salvarRascunho',{dados:JSON.stringify(S.draft)});if(show)toast('Rascunho salvo.')}catch(e){if(show)toast(e.message)}}
async function finishChecklist(){const d=S.draft;if(!d.responsavel.trim())return toast('Informe o responsável.');if(d.respostas.some(x=>!x.resposta))return toast('Responda todos os itens.');if(d.respostas.some(x=>x.resposta==='NAO'&&!x.detalhe.trim()))return toast('Descreva todas as pendências marcadas como NÃO.');openModal(`<h3>Finalizar checklist?</h3><p class="muted">Depois de finalizar, as respostas entrarão no histórico e cada item marcado como NÃO será criado como pendência.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmFinish()">Finalizar</button></div>`)}
async function confirmFinish(){closeModal();try{load();const j=await api('finalizarChecklist',{dados:JSON.stringify(S.draft)});S.draft=null;toast(`Checklist finalizado. ${j.pendenciasCriadas} pendência(s) criada(s).`);await refresh();go('inicio')}catch(e){toast(e.message)}finally{load(false)}}
function pendTable(list,title){return `<div class="sectionTitle"><h2>${esc(title)}</h2></div><div class="tableWrap"><table class="table"><thead><tr><th>Filial</th><th>Item</th><th>Detalhe</th><th>Data</th><th>Status</th></tr></thead><tbody>${list.length?list.map(p=>`<tr><td>${esc(p.FILIAL_NOME)}</td><td><b>${esc(p.ITEM)}</b><br><span class="muted">${p.SECAO==='ADMIN'?'Incluída pelo Léo':esc(p.SECAO)}</span></td><td>${esc(p.DETALHE)}${p.QUANTIDADE?`<br><span class="muted">Qtd: ${esc(p.QUANTIDADE)} ${p.LOCALIZACAO?'• '+esc(p.LOCALIZACAO):''}</span>`:''}</td><td>${dateBR(p.CRIADO_EM)}</td><td><span class="badge ${p.STATUS==='SOLUCIONADA'?'green':'red'}">${esc(p.STATUS)}</span></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Nenhum registro.</td></tr>`}</tbody></table></div>`}
function renderPendencias(){const list=S.data.pendencias;$('#main').innerHTML=top('Pendências',S.user.perfil==='ADMIN'?'Pendências de todas as filiais.':'Acompanhe o que ficou pendente na sua filial.')+`<div class="tableWrap"><table class="table"><thead><tr><th>Filial</th><th>Item</th><th>Detalhe</th><th>Responsável/Prazo</th><th>Status</th><th>Ação</th></tr></thead><tbody>${list.length?list.map(p=>`<tr><td>${esc(p.FILIAL_NOME)}</td><td><b>${esc(p.ITEM)}</b><br><span class="muted">${p.SECAO==='ADMIN'?'Incluída pelo Léo':esc(p.SECAO)}</span></td><td>${esc(p.DETALHE)}${p.QUANTIDADE?`<br>Qtd: ${esc(p.QUANTIDADE)}`:''}${p.LOCALIZACAO?` • ${esc(p.LOCALIZACAO)}`:''}</td><td>${esc(p.RESPONSAVEL||'-')}<br><span class="muted">${esc(p.PRAZO||'')}</span></td><td><span class="badge ${p.STATUS==='SOLUCIONADA'?'green':'red'}">${esc(p.STATUS)}</span></td><td>${p.STATUS!=='SOLUCIONADA'?`<button class="btn good" onclick="resolvePend('${esc(p.ID)}','${esc(p.ITEM)}')">Solucionar</button>`:`<span class="muted">${esc(p.SOLUCAO||'')}</span>`}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhuma pendência.</td></tr>`}</tbody></table></div>`}
function resolvePend(id,item){openModal(`<h3>Solucionar pendência</h3><p><b>${esc(item)}</b></p><div class="field"><label>O QUE FOI FEITO? *</label><textarea id="solution" rows="4" placeholder="Descreva a solução"></textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn good" onclick="confirmResolve('${id}')">Marcar como solucionada</button></div>`)} async function confirmResolve(id){const sol=$('#solution').value.trim();if(!sol)return toast('Informe a solução.');closeModal();try{load();await api('resolverPendencia',{id,solucao:sol});await refresh();go('pendencias');toast('Pendência solucionada.')}catch(e){toast(e.message)}finally{load(false)}}
function renderHistorico(){const h=S.data.historico;$('#main').innerHTML=top('Histórico',S.user.perfil==='ADMIN'?'Checklists realizados por todas as filiais.':'Checklists realizados pela sua filial.')+`<div class="tableWrap"><table class="table"><thead><tr><th>Filial</th><th>Responsável</th><th>Finalizado</th><th>Itens</th><th>Sim</th><th>Não</th></tr></thead><tbody>${h.length?h.map(x=>`<tr><td><b>${esc(x.FILIAL_NOME)}</b></td><td>${esc(x.RESPONSAVEL)}</td><td>${dateBR(x.FINALIZADO_EM,true)}</td><td>${esc(x.TOTAL)}</td><td><span class="badge green">${esc(x.SIM)}</span></td><td><span class="badge ${Number(x.NAO)?'red':'green'}">${esc(x.NAO)}</span></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Nenhum checklist realizado.</td></tr>`}</tbody></table></div>`}
function renderUsuarios(){const fs=S.data.filiais;$('#main').innerHTML=top('Usuários e senhas','Léo pode alterar a senha e o e-mail de aviso de cada filial.')+`<div class="card"><div class="userRow"><b>Filial / usuário</b><b>E-mail de aviso</b><b>Ações</b></div>${fs.map(f=>`<div class="userRow"><div><b>${esc(f.nome)}</b><div class="muted">Usuário: ${esc(f.usuario)}</div></div><input id="em_${f.id}" class="input" type="email" value="${esc(f.email)}" placeholder="email@exemplo.com"><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" onclick="saveEmail('${f.id}')">Salvar e-mail</button><button class="btn primary" onclick="changePass('${f.id}','${esc(f.nome)}')">Alterar senha</button></div></div>`).join('')}</div>`}
function changePass(id,nome){openModal(`<h3>Alterar senha — ${esc(nome)}</h3><div class="field"><label>NOVA SENHA</label><input id="newPass" class="input" type="password"></div><div class="field"><label>CONFIRMAR NOVA SENHA</label><input id="newPass2" class="input" type="password"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmPass('${id}')">Salvar nova senha</button></div>`)} async function confirmPass(id){const a=$('#newPass').value,b=$('#newPass2').value;if(a!==b)return toast('As senhas não conferem.');try{load();await api('alterarSenha',{usuarioId:id,novaSenha:a});closeModal();toast('Senha alterada.')}catch(e){toast(e.message)}finally{load(false)}} async function saveEmail(id){try{load();await api('salvarEmailFilial',{usuarioId:id,email:$('#em_'+id).value});await refresh();toast('E-mail salvo.')}catch(e){toast(e.message)}finally{load(false)}}
function renderAvisos(){const fs=S.data.filiais, cfg=S.data.configAviso||{};$('#main').innerHTML=top('Avisos de vencimento','Prazo atual: '+S.data.prazoDias+' dias.')+`<div class="card"><div class="field"><label>E-MAIL DO ADMINISTRADOR</label><div style="display:flex;gap:8px"><input id="adminEmail" class="input" type="email" value="${esc(S.data.emailAdmin||'')}" placeholder="email@exemplo.com"><button class="btn primary" onclick="saveAdminEmail()">Salvar</button></div></div></div><div class="sectionTitle"><h2>Controle por filial</h2></div><div class="adminGrid">${fs.map(f=>{const c=cfg[f.codigo]||{};return `<div class="card"><b>${esc(f.nome)}</b><p class="muted">${c.pausado?'Avisos pausados':c.adiarAte?'Próximo aviso após '+esc(c.adiarAte):'Avisos automáticos ativos'}</p><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" onclick="notice('${f.codigo}','adiar',3)">3 dias</button><button class="btn" onclick="notice('${f.codigo}','adiar',7)">7 dias</button><button class="btn" onclick="notice('${f.codigo}','adiar',15)">15 dias</button>${c.pausado?`<button class="btn good" onclick="notice('${f.codigo}','reativar')">Reativar</button>`:`<button class="btn danger" onclick="notice('${f.codigo}','pausar')">Pausar</button>`}</div></div>`}).join('')}</div>`}
async function notice(cod,acao,dias){try{load();await api('adiarAviso',{filialCodigo:cod,acao,dias});await refresh();go('avisos');toast('Configuração atualizada.')}catch(e){toast(e.message)}finally{load(false)}} async function saveAdminEmail(){try{load();await api('salvarEmailAdmin',{email:$('#adminEmail').value});await refresh();go('avisos');toast('E-mail do administrador salvo.')}catch(e){toast(e.message)}finally{load(false)}}
function renderMinhaSenha(){$('#main').innerHTML=top('Minha senha','Altere a senha de acesso desta filial.')+`<div class="card" style="max-width:520px"><div class="field"><label>SENHA ATUAL</label><input id="oldp" class="input" type="password"></div><div class="field"><label>NOVA SENHA</label><input id="np" class="input" type="password"></div><div class="field"><label>CONFIRMAR NOVA SENHA</label><input id="np2" class="input" type="password"></div><button class="btn primary" onclick="myPass()">Alterar senha</button></div>`} async function myPass(){const a=$('#np').value,b=$('#np2').value;if(a!==b)return toast('As senhas não conferem.');try{load();await api('alterarMinhaSenha',{senhaAtual:$('#oldp').value,novaSenha:a});toast('Senha alterada.')}catch(e){toast(e.message)}finally{load(false)}}
async function refresh(){const j=await api('bootstrap');S.data=j;S.user=j.user;if(j.rascunho)S.draft=j.rascunho} function openModal(h){$('#modalBox').innerHTML=h;$('#modal').classList.remove('hidden')} function closeModal(){$('#modal').classList.add('hidden')} function dateBR(v,time=false){if(!v)return '-';const d=new Date(v);if(isNaN(d))return esc(v);return d.toLocaleString('pt-BR',time?{dateStyle:'short',timeStyle:'short'}:{dateStyle:'short'})}
$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});updateApiSetup();if(API_URL&&S.token)boot();
</script>
</body>
</html>
